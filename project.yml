name: FindDiskKiller

options:
  bundleIdPrefix: com.jianyintang
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"

configs:
  Debug: debug
  Release: release

packages:
  FindDiskKillerPackage:
    path: .
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.4

settings:
  base:
    CLANG_ENABLE_MODULES: YES
    ENABLE_HARDENED_RUNTIME: YES
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_VERSION: "6.0"
  configs:
    Debug:
      CODE_SIGN_STYLE: Manual
      CODE_SIGN_IDENTITY: Developer ID Application
      DEVELOPMENT_TEAM: Y3A8BJ4475
      ONLY_ACTIVE_ARCH: YES
    Release:
      CODE_SIGN_STYLE: Manual
      CODE_SIGN_IDENTITY: Developer ID Application
      DEVELOPMENT_TEAM: Y3A8BJ4475
      ONLY_ACTIVE_ARCH: NO

targets:
  FindDiskKillerApp:
    type: application
    platform: macOS
    sources:
      - path: Sources/FindDiskKillerApp
        excludes:
          - Resources
      - path: Sources/FindDiskKillerApp/Resources
        buildPhase: resources
      - path: THIRD_PARTY_NOTICES.md
        buildPhase: resources
      - path: AppConfig/com.jianyintang.FindDiskKiller.TraceHelper.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchDaemons
      - path: AppConfig/com.jianyintang.FindDiskKiller.TraceHelper.v2.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchDaemons
    info:
      path: AppConfig/FindDiskKiller-Info.plist
      properties:
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleDisplayName: FindDiskKiller
        CFBundleIconFile: FindDiskKiller
        NSHumanReadableCopyright: Copyright © 2026 Jianyin Tang
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSMultipleInstancesProhibited: true
        NSHighResolutionCapable: true
        NSPrincipalClass: NSApplication
        NSSupportsAutomaticGraphicsSwitching: true
        SUFeedURL: https://github.com/jianyintang/find-disk-killer/releases/latest/download/appcast.xml
        SUPublicEDKey: $(SPARKLE_PUBLIC_ED_KEY)
        SUVerifyUpdateBeforeExtraction: true
        SURequireSignedFeed: true
        SUEnableSystemProfiling: false
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        SUAutomaticallyUpdate: false
        SUAllowsAutomaticUpdates: false
    entitlements:
      path: AppConfig/FindDiskKiller.entitlements
      properties:
        com.apple.application-identifier: Y3A8BJ4475.com.jianyintang.FindDiskKiller
        com.apple.developer.team-identifier: Y3A8BJ4475
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        PRODUCT_BUNDLE_IDENTIFIER: com.jianyintang.FindDiskKiller
        PRODUCT_NAME: FindDiskKiller
        CURRENT_PROJECT_VERSION: "3"
        MARKETING_VERSION: 0.1.0
        SPARKLE_PUBLIC_ED_KEY: ""
    dependencies:
      - package: FindDiskKillerPackage
        product: FindDiskKillerCore
      - package: FindDiskKillerPackage
        product: FindDiskKillerNodeRuntime
      - package: FindDiskKillerPackage
        product: FindDiskKillerTraceProtocol
      - package: Sparkle
        product: Sparkle
      - target: FindDiskKillerTraceHelper
        link: false
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Library/LaunchDaemons
      - target: FindDiskKillerClaudeCleanupHelper
        link: false
        embed: true
        codeSign: true
        copy:
          destination: executables
    postBuildScripts:
      - name: Prepare Official Claude Cleanup Runtime
        script: /bin/zsh "$SRCROOT/scripts/prepare-claude-cleanup-runtime.sh"
        basedOnDependencyAnalysis: false
    scheme:
      gatherCoverageData: false
      testTargets: []

  FindDiskKillerTraceHelper:
    type: tool
    platform: macOS
    sources:
      - path: Sources/FindDiskKillerTraceHelper
    info:
      path: AppConfig/FindDiskKillerTraceHelper-Info.plist
      properties:
        CFBundleDevelopmentRegion: en
        CFBundleIdentifier: com.jianyintang.FindDiskKiller.TraceHelper.v2
        CFBundleName: FindDiskKiller Trace Helper
        CFBundlePackageType: BNDL
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    entitlements:
      path: AppConfig/FindDiskKillerTraceHelper.entitlements
      properties:
        com.apple.application-identifier: Y3A8BJ4475.com.jianyintang.FindDiskKiller.TraceHelper.v2
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jianyintang.FindDiskKiller.TraceHelper.v2
        PRODUCT_NAME: com.jianyintang.FindDiskKiller.TraceHelper
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
        CURRENT_PROJECT_VERSION: "3"
        MARKETING_VERSION: 0.1.0
        SKIP_INSTALL: YES
    dependencies:
      - package: FindDiskKillerPackage
        product: FindDiskKillerTraceProtocol
      - package: FindDiskKillerPackage
        product: CFindDiskKillerTrace

  FindDiskKillerClaudeCleanupHelper:
    type: tool
    platform: macOS
    sources:
      - path: Sources/FindDiskKillerClaudeCleanupHelper
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jianyintang.FindDiskKiller.ClaudeCleanupHelper
        PRODUCT_NAME: FindDiskKillerClaudeCleanupHelper
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
        SKIP_INSTALL: YES
    dependencies:
      - package: FindDiskKillerPackage
        product: FindDiskKillerNodeRuntime
