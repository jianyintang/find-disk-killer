      <rect x="478" y="557" width="190" height="126" rx="8" fill="#000000" fill-opacity="0.10" filter="url(#glass-shadow)"/>
      <rect x="690" y="557" width="190" height="126" rx="8" fill="#000000" fill-opacity="0.06" filter="url(#glass-shadow)"/>
      <rect x="902" y="557" width="190" height="126" rx="8" fill="#000000" fill-opacity="0.07" filter="url(#glass-shadow)"/>
      <rect x="54" y="554" width="190" height="126" rx="8" fill="#ffffff" fill-opacity="0.62" stroke="#1b2226" stroke-opacity="0.13" stroke-width="0.75"/>
      <rect x="266" y="554" width="190" height="126" rx="8" fill="#151a1d" stroke="#ffffff" stroke-opacity="0.13" stroke-width="0.75"/>
      <rect x="478" y="554" width="190" height="126" rx="8" fill="#ffffff" fill-opacity="0.62" stroke="#1b2226" stroke-opacity="0.40" stroke-width="1"/>
